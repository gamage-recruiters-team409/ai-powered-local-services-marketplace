spring.application.name=marketplace

# Load local secrets from backend/.env (git-ignored)
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/marketplace}

# ===================================================================
# Security & Authentication Configuration
# ===================================================================
# JWT Secret (min 256 bits / 32 characters in production)
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# CORS Configuration
app.auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email Verification Policy
# TODO: Switch default to true when email verification service is implemented
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

# Account Lockout Policy
app.auth.max-failed-logins=${AUTH_MAX_FAILED_LOGINS:5}
app.auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:15}

# Super Admin Seed (Optional, creates initial SUPER_ADMIN if none exists)
app.auth.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.auth.super-admin.password=${SUPER_ADMIN_PASSWORD:}
