spring.application.name=marketplace
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Load local secrets from backend/.env (git-ignored)
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/marketplace}

# ===================================================================
# Security & Authentication Configuration
# ===================================================================
# JWT Secret (min 256 bits / 32 characters in production)
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# CORS Configuration
app.auth.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Email Verification Policy
# Default: true (enforced). Override to false ONLY in local/dev/test profiles via .env.
# Startup validator strictly blocks false in prod/production/staging/stage/uat or no-profile.
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}
app.auth.email-verification-expiry-minutes=${AUTH_EMAIL_VERIFICATION_EXPIRY_MINUTES:1440}
app.auth.password-reset-expiry-minutes=${AUTH_PASSWORD_RESET_EXPIRY_MINUTES:30}
app.auth.resend-verification-wait-seconds=${AUTH_RESEND_VERIFICATION_WAIT_SECONDS:60}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Account Lockout Policy
app.auth.max-failed-logins=${AUTH_MAX_FAILED_LOGINS:5}
app.auth.lock-duration-minutes=${AUTH_LOCK_DURATION_MINUTES:15}

# Refresh Token Reuse Grace Window (seconds)
# Concurrent refresh requests within this window return 409 instead of revoking sessions.
app.auth.refresh-reuse-grace-seconds=${AUTH_REFRESH_REUSE_GRACE_SECONDS:10}

# Super Admin Seed (Optional, creates initial SUPER_ADMIN if none exists)
app.auth.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.auth.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# ===================================================================
# Customer Module Configuration
# ===================================================================
app.customer.max-addresses=${CUSTOMER_MAX_ADDRESSES:10}
app.customer.profile-image-cleanup.enabled=true
app.customer.profile-image-cleanup.interval=PT5M
app.customer.profile-image-cleanup.initial-delay=PT1M
app.customer.profile-image-cleanup.batch-size=25
app.customer.profile-image-cleanup.lease=PT2M
app.customer.profile-image-cleanup.referenced-defer=PT5M
app.customer.profile-image-cleanup.referenced-stale-after=PT6H

# ===================================================================
# Multipart File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ===================================================================
# Rate Limiting Configuration (FR-AUTH / Security)
# ===================================================================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Maximum number of tracked keys enforced per bucket (fails closed for new keys when saturated)
app.rate-limit.max-tracked-keys=${RATE_LIMIT_MAX_TRACKED_KEYS:10000}
app.rate-limit.login-ip.max-requests=${RATE_LIMIT_LOGIN_IP_MAX_REQUESTS:30}
app.rate-limit.login-ip.window-minutes=${RATE_LIMIT_LOGIN_IP_WINDOW_MINUTES:15}
# Keyed by normalized email only (independent of client IP)
app.rate-limit.login-account.max-requests=${RATE_LIMIT_LOGIN_ACCOUNT_MAX_REQUESTS:10}
app.rate-limit.login-account.window-minutes=${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_MINUTES:15}
app.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX_REQUESTS:10}
app.rate-limit.register.window-minutes=${RATE_LIMIT_REGISTER_WINDOW_MINUTES:60}
app.rate-limit.sensitive.max-requests=${RATE_LIMIT_SENSITIVE_MAX_REQUESTS:5}
app.rate-limit.sensitive.window-minutes=${RATE_LIMIT_SENSITIVE_WINDOW_MINUTES:15}
app.rate-limit.forgot-password-ip.max-requests=${RATE_LIMIT_FORGOT_PASSWORD_IP_MAX_REQUESTS:10}
app.rate-limit.forgot-password-ip.window-minutes=${RATE_LIMIT_FORGOT_PASSWORD_IP_WINDOW_MINUTES:60}
app.rate-limit.forgot-password-email.max-requests=${RATE_LIMIT_FORGOT_PASSWORD_EMAIL_MAX_REQUESTS:3}
app.rate-limit.forgot-password-email.window-minutes=${RATE_LIMIT_FORGOT_PASSWORD_EMAIL_WINDOW_MINUTES:60}
app.rate-limit.resend-verification-ip.max-requests=${RATE_LIMIT_RESEND_VERIFICATION_IP_MAX_REQUESTS:10}
app.rate-limit.resend-verification-ip.window-minutes=${RATE_LIMIT_RESEND_VERIFICATION_IP_WINDOW_MINUTES:60}
app.rate-limit.resend-verification-email.max-requests=${RATE_LIMIT_RESEND_VERIFICATION_EMAIL_MAX_REQUESTS:3}
app.rate-limit.resend-verification-email.window-minutes=${RATE_LIMIT_RESEND_VERIFICATION_EMAIL_WINDOW_MINUTES:60}
app.rate-limit.verify-email.max-requests=${RATE_LIMIT_VERIFY_EMAIL_MAX_REQUESTS:30}
app.rate-limit.verify-email.window-minutes=${RATE_LIMIT_VERIFY_EMAIL_WINDOW_MINUTES:15}

app.ai.provider=${AI_PROVIDER:}
app.ai.model=${AI_MODEL:}
app.ai.api-key=${AI_PLATFORM_API_KEY:}
app.ai.request-timeout-ms=${AI_REQUEST_TIMEOUT_MS:15000}
app.ai.max-input-characters=${AI_MAX_INPUT_CHARACTERS:4000}
app.ai.max-context-characters=${AI_MAX_CONTEXT_CHARACTERS:8000}
app.rate-limit.reset-password.max-requests=${RATE_LIMIT_RESET_PASSWORD_MAX_REQUESTS:20}
app.rate-limit.reset-password.window-minutes=${RATE_LIMIT_RESET_PASSWORD_WINDOW_MINUTES:15}
app.email.provider=${EMAIL_PROVIDER:dev}
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.from-address=${EMAIL_FROM_ADDRESS:}
app.email.from-name=${EMAIL_FROM_NAME:AI-Powered Local Services Marketplace}
app.email.brevo.timeout-seconds=${EMAIL_TIMEOUT_SECONDS:10}



