spring.application.name=marketplace-test

# Disable MongoDB auto-configuration in web MVC slice tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-testing-purpose-only
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-seconds=604800
app.auth.cors.allowed-origins=http://localhost:5173
app.auth.require-email-verification=false
app.auth.max-failed-logins=5
app.auth.lock-duration-minutes=15
