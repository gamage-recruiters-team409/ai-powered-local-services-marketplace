spring.application.name=marketplace-integration-test

# MongoDB auto-configuration is ENABLED (spring.data.mongodb.uri injected dynamically by Testcontainers)
# Do NOT exclude MongoAutoConfiguration or MongoDataAutoConfiguration in this profile

# JWT Configuration (Test dummy value)
app.jwt.secret=integration-test-secret-key-must-be-at-least-256-bits-long-for-testing-purpose-only
app.jwt.access-token-expiration-seconds=900
app.jwt.refresh-token-expiration-seconds=604800

# CORS Configuration
app.auth.cors.allowed-origins=http://localhost:5173

# Email Verification (bypass allowed in integration-test profile)
app.auth.require-email-verification=false

# Account Lockout Policy
app.auth.max-failed-logins=5
app.auth.lock-duration-minutes=15

# Refresh Token Reuse Grace Window (seconds)
app.auth.refresh-reuse-grace-seconds=10

# Super Admin Seed (Empty so SuperAdminSeeder does not run during test)
app.auth.super-admin.email=
app.auth.super-admin.password=
